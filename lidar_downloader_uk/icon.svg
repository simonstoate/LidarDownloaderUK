<?xml version="1.0" encoding="UTF-8"?>
<!-- LIDAR Downloader UK icon: a map tile with a LiDAR-scanned terrain surface and a download badge.
     Kept deliberately bold so it still reads at 16-24 px toolbar sizes. -->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3f1fb"/>
      <stop offset="1" stop-color="#bcdcf2"/>
    </linearGradient>
    <!-- DTM-style elevation ramp: green valleys -> ochre -> brown -> snow -->
    <linearGradient id="terrain" x1="0" y1="60" x2="0" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2e7d32"/>
      <stop offset="0.4" stop-color="#7cb342"/>
      <stop offset="0.62" stop-color="#d4a53c"/>
      <stop offset="0.8" stop-color="#8d5a3b"/>
      <stop offset="0.9" stop-color="#ffffff"/>
    </linearGradient>
    <clipPath id="tile">
      <rect x="3" y="3" width="58" height="58" rx="8"/>
    </clipPath>
  </defs>

  <!-- Tile -->
  <rect x="3" y="3" width="58" height="58" rx="8" fill="url(#sky)"/>

  <g clip-path="url(#tile)">
    <!-- LiDAR pulses from the sensor down to the ground -->
    <g stroke="#e53935" stroke-width="2.2" stroke-linecap="round">
      <line x1="30" y1="3" x2="12" y2="35"/>
      <line x1="30" y1="3" x2="24" y2="20"/>
      <line x1="30" y1="3" x2="38" y2="26"/>
    </g>

    <!-- Terrain surface: two peaks -->
    <path d="M3 40 L12 35 L24 19 L31 28 L38 25 L48 36 L61 30 L61 61 L3 61 Z"
          fill="url(#terrain)" stroke="#2d2419" stroke-width="2.4" stroke-linejoin="round"/>

    <!-- Laser returns -->
    <g fill="#e53935" stroke="#ffffff" stroke-width="1.2">
      <circle cx="12" cy="35" r="3"/>
      <circle cx="24" cy="19.5" r="3"/>
      <circle cx="38" cy="25.5" r="3"/>
    </g>
  </g>

  <!-- Tile border -->
  <rect x="3" y="3" width="58" height="58" rx="8" fill="none" stroke="#17405a" stroke-width="3"/>

  <!-- Download badge -->
  <circle cx="47" cy="47" r="14.5" fill="#1565c0" stroke="#ffffff" stroke-width="2.8"/>
  <path d="M47 38 V51.5 M40.8 45.6 L47 51.8 L53.2 45.6" fill="none" stroke="#ffffff" stroke-width="3.8"
        stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="40.5" y1="56" x2="53.5" y2="56" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
</svg>
